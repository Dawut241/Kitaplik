<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Kitaplık</title>
<style>
:root{--bg:#f4f4f4;--kart:#ffffff;--yazi:#222222;--soluk:#666666;--golge:#0003}
:root[data-tema="koyu"]{--bg:#121212;--kart:#1e1e1e;--yazi:#e8e8e8;--soluk:#a0a0a0;--golge:#0008;color-scheme:dark}
body{font-family:Georgia,serif;max-width:700px;margin:0 auto;padding:16px;background:var(--bg);color:var(--yazi);line-height:1.7}
.ust{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:8px 0}
input{width:100%;padding:12px;font-size:16px;box-sizing:border-box;margin-bottom:12px;background:var(--kart);color:var(--yazi);border:1px solid var(--soluk);border-radius:6px}
.kart{background:var(--kart);padding:16px;margin-bottom:10px;border-radius:8px;box-shadow:0 1px 3px var(--golge);cursor:pointer}
.kart small{color:var(--soluk)}
#okuyucu{display:none}
#metin{white-space:pre-wrap;font-size:18px}
button{padding:10px 16px;font-size:16px;margin-bottom:12px;background:var(--kart);color:var(--yazi);border:1px solid var(--soluk);border-radius:6px;cursor:pointer}
</style>
<script>
(function(){
  var t=null;
  try{t=localStorage.getItem('tema')}catch(e){}
  if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'koyu':'acik'}
  document.documentElement.setAttribute('data-tema',t);
})();
</script>

</head><body>
<div id="liste">
<div class="ust">
<p style="color:#d4af37;font-weight:bold;letter-spacing:1px;margin:0 0 4px;font-size:14px;text-transform:uppercase">Small site, big minds.</p><h1>Online Kitaplık</h1>
<button id="tema"></button>
</div>
<input id="ara" placeholder="Kitap veya yazar ara...">
<div id="kitaplar"></div>
</div>
<div id="okuyucu">
<div class="ust">
<button id="geri">← Geri</button>
<button id="tema2"></button>
</div>
<h2 id="baslik"></h2>
<div id="metin"></div>
</div>
<script>
var kitaplar=[];
function temaYaz(){
  var koyu=document.documentElement.getAttribute('data-tema')==='koyu';
  var yazi=koyu?'☀️ Aydınlık':'🌙 Karanlık';
  document.getElementById('tema').textContent=yazi;
  document.getElementById('tema2').textContent=yazi;
}
function temaDegis(){
  var koyu=document.documentElement.getAttribute('data-tema')==='koyu';
  var yeni=koyu?'acik':'koyu';
  document.documentElement.setAttribute('data-tema',yeni);
  try{localStorage.setItem('tema',yeni)}catch(e){}
  temaYaz();
}
document.getElementById('tema').onclick=temaDegis;
document.getElementById('tema2').onclick=temaDegis;
temaYaz();
function goster(l){
  var kutu=document.getElementById('kitaplar');
  kutu.innerHTML='';
  l.forEach(function(k){
    var d=document.createElement('div');
    d.className='kart';
    d.innerHTML='<b>'+k.baslik+'</b><br><small>'+(k.yazar||'')+'</small>';
    d.onclick=function(){ac(k)};
    kutu.appendChild(d);
  });
}
function ac(k){
  document.getElementById('liste').style.display='none';
  document.getElementById('okuyucu').style.display='block';
  document.getElementById('baslik').textContent=k.baslik;
  var m=document.getElementById('metin');
  m.textContent='Yükleniyor...';
  window.scrollTo(0,0);
  fetch(k.dosya).then(function(r){
    if(!r.ok) throw new Error('Dosya bulunamadı: '+k.dosya+' (hata '+r.status+')');
    return r.text();
  }).then(function(t){metinYaz(m,t,k)})
  .catch(function(e){m.textContent=e.message});
}
document.getElementById('geri').onclick=function(){
  document.getElementById('okuyucu').style.display='none';
  document.getElementById('liste').style.display='block';
};
document.getElementById('ara').oninput=function(e){
  var q=e.target.value.toLowerCase();
  goster(kitaplar.filter(function(k){return (k.baslik+' '+(k.yazar||'')).toLowerCase().indexOf(q)>-1}));
};
fetch('books.json').then(function(r){return r.json()}).then(function(d){kitaplar=d;goster(d)});
</script><script src="konular.js"></script><script src="notlar.js"></script><script src="bolumler.js?v=2"></script><script src="karsilastirma.js"></script><script src="bilgi.js"></script><script src="testler.js"></script><script src="tema3.js"></script><script src="analiz.js"></script><script src="yarisma.js"></script><script src="ayna.js"></script><script src="yazar.js"></script><script src="zeka.js"></script><script src="devam.js"></script><script src="pwa.js"></script><script src="favoriler.js"></script><script src="yazi.js"></script><script src="ilerleme.js"></script><script src="ara.js"></script><script src="ara2.js"></script><script src="sade.js"></script><script src="paylas.js"></script><script src="tanitim.js"></script><script src="gunun.js"></script><script src="kuranoku.js"></script><script src="kuransure.js"></script><script src="yazarkutu.js"></script><script src="sesli.js?v=2"></script><script src="alintikart.js"></script><script src="sesmix.js"></script><script src="mesajton.js?v=4"></script><script src="yks.js"></script><script src="yazarfiltre.js"></script><script src="kuranbilgi.js"></script><script src="kodlama.js"></script><script src="kodlab.js"></script><script src="kodkarier.js"></script><script src="kodsozluk.js"></script><p style="text-align:center;padding:20px;font-size:14px"><a href="gizlilik.html" style="color:inherit;opacity:.7">Gizlilik Politikası</a></p><script src="kodgrup.js"></script><script src="vitrin.js"></script><script src="yksplus.js"></script><p style="text-align:center;font-size:13px;margin:20px 0">Kurucu: Dawut Mollayew · <a href="hakkinda.html">Hakkında</a></p>
